name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/caiovpinheiro/cursos-eduit:latest
            ghcr.io/caiovpinheiro/cursos-eduit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/cursos-eduit/visibility" \
            -f visibility=public

      - name: Trigger Easypanel
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_CURSOS }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "Secret EASYPANEL_DEPLOY_CURSOS is not set."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST "$DEPLOY_URL"
          echo "Deployment triggered."
